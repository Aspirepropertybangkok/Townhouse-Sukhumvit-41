<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Townhouse in Sukhumvit 41</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; margin: 0; padding: 0; }
        body { background-color: #ffffff; color: #333; padding: 40px 8%; position: relative; }
        h1 { font-size: 2.2rem; font-weight: 600; margin-bottom: 25px; color: #111; }
        .info-card { border: 2px solid #f1c40f; border-radius: 15px; padding: 20px; width: 350px; background-color: #fff; margin-bottom: 35px; }
        .badge { background-color: #f39c12; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-bottom: 8px; }
        .price { font-size: 2rem; font-weight: 600; color: #d35400; line-height: 1.2; }
        .price span { font-size: 1.2rem; color: #333; }
        .transfer-fee { font-size: 0.85rem; color: #666; margin: 5px 0 15px 0; }
        .specs { display: flex; gap: 15px; font-size: 0.9rem; color: #555; }
        .item { display: flex; align-items: center; gap: 5px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .gallery img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; border: 1px solid #eee; }
        .map-container { width: 100%; height: 350px; border-radius: 12px; overflow: hidden; border: 1px solid #ccc; margin-bottom: 100px; }
        .map-container iframe { width: 100%; height: 100%; border: none; }
        .contact-sidebar { position: fixed; bottom: 40px; right: 40px; display: flex; flex-direction: column; gap: 10px; z-index: 999; width: 250px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 20px; color: white; text-decoration: none; border-radius: 25px; font-weight: 500; font-size: 0.95rem; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .btn-phone { background-color: #3b82f6; }
        .btn-line { background-color: #00b900; }
        .btn-whatsapp { background-color: #25d366; }
        @media (max-width: 768px) { body { padding: 20px; } .info-card { width: 100%; } .contact-sidebar { position: relative; bottom: 0; right: 0; width: 100%; margin-top: 30px; } }
    </style>
</head>
<body>

    <!-- เปลี่ยนชื่อหัวข้อตรงนี้ได้ตามต้องการครับ -->
    <h1>Townhouse for Rent - Sukhumvit 41</h1>

    <div class="info-card">
        <div class="badge"><i class="fa-solid fa-tag"></i> Asking for</div>
        <!-- ใส่ราคาตรงนี้ได้เลยครับ -->
        <div class="price">ุ 60,000 <span>บาท</span></div>
        <div class="transfer-fee"> Minimum 1-year contract</div>
        <div class="specs">
            <!-- ปรับเปลี่ยนสเปกห้องตรงนี้ได้เลยครับ -->
            <div class="item"><i class="fa-solid fa-vector-square"></i> 25 Sq.wa. 300 Sq.m.</div>
            <div class="item"><i class="fa-solid fa-bed"></i> 5 bedrooms, 4 bathrooms</div>
            <div class="item"><i class="fa-solid fa-train-subway"></i> BTS Phrom Phong</div>
        </div>
    </div>

    <!-- แกลเลอรีรูปภาพ (ปรับจำนวนภาพให้ตรงกับที่คุณอัปโหลดไว้ได้เลยครับ) -->
    <div class="gallery">
        <img src="0.jpg">
        <img src="1.jpg">
        <img src="2.jpg">
        <img src="3.jpg">
        <img src="4.jpg">
        <img src="5.jpg">
        <img src="6.jpg">
        <img src="7.jpg">
        <img src="8.jpg">
    </div>

        <!-- แผนที่พิกัดซอยสุขุมวิท 41 -->
    <div class="map-container">
        <iframe src="https://google.com" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="contact-sidebar">
        <a href="tel:0931359945" class="btn btn-phone"><i class="fa-solid fa-phone"></i> Call 093-135-9945</a>
        <a href="https://line.me" target="_blank" class="btn btn-line"><i class="fa-brands fa-line"></i> LINE @aspireproperty</a>
        <a href="https://wa.me" target="_blank" class="btn btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp +6693-135-9945</a>
    </div>

</body>
</html>
